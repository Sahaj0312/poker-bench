<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1110"><title>River Room — Poker observatory</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head><body>
<header class="mast"><div class="navwrap">
<a class="brand" href="#table"><img src="assets/mark.svg" alt="">River Room</a>
<nav aria-label="Main navigation"><button class="nav active" data-go="table"><i data-icon="table"></i>Table view</button><button class="nav" data-go="archive"><i data-icon="archive"></i>Sessions</button></nav>
<div class="topactions"><button class="square" id="settings" aria-label="Player connections" title="Player connections"><i data-icon="sliders"></i></button><button class="primary" id="new"><i data-icon="plus"></i>New session</button></div>
</div></header>
<main>
<div id="tablePage">
<section class="pagetitle"><div><div class="overline"><span class="rule"></span> POKER OBSERVATORY</div><h1>The table<span>.</span></h1></div><div class="viewlabel"><i data-icon="eye"></i>Spectator view</div></section>
<div class="workspace">
<section class="tablepanel panel">
<header class="panelhead"><div class="headingrow"><i data-icon="spade" class="mint"></i><h2>Main table</h2><span id="modeTag" class="tag"></span></div><div class="tabletype">No-limit Hold’em</div></header>
<div id="stage" class="stage" aria-label="Poker table"></div>
<footer class="tablefoot"><span><i data-icon="layers"></i>Blinds <b id="blinds"></b></span><span><i data-icon="people"></i><b id="atTable">5</b> seated</span><button id="audit"><i data-icon="shield"></i>Fairness log</button></footer>
</section>
<section class="chatpanel panel"><header class="panelhead"><div class="headingrow"><i data-icon="chat" class="mint"></i><h2>Table talk</h2></div><span id="chatcount" class="counter"></span></header>
<div class="feedtabs" role="group" aria-label="Feed filter"><button class="selected" data-feed="talk">Chat</button><button data-feed="actions">Actions</button></div>
<div id="feed" class="feed"></div><div class="chatfoot"><i data-icon="clock"></i><span id="feedclock">Move times</span></div></section>
</div>
<section class="replay panel"><div class="replayhead"><div class="headingrow"><i data-icon="replay" class="mint"></i><h2>Session replay</h2></div><span id="eventcount" class="mono"></span></div>
<div class="transport"><div class="controls"><button id="back" class="plainicon" aria-label="Previous event" title="Previous event"><i data-icon="prev"></i></button><button id="play" class="play" aria-label="Play replay"><i data-icon="play"></i></button><button id="forward" class="plainicon" aria-label="Next event" title="Next event"><i data-icon="next"></i></button></div>
<div class="trackwrap"><input id="timeline" type="range" min="0" max="1" value="0" aria-label="Replay timeline"><div id="ticks"></div></div>
<select id="speed" aria-label="Replay speed"><option value=".5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="table">Table pace</option></select></div>
<div class="replaybottom"><span id="moment"></span><button id="download"><i data-icon="download"></i>Export replay</button></div></section>
<div id="runstatus"></div>
<section class="ledger"><div class="sectiontitle"><div class="headingrow"><i data-icon="chart" class="mint"></i><h2>Chip standings</h2></div><span id="standingCaption"></span></div><div id="standings"></div></section>
</div>
<div id="archivePage" hidden><section class="pagetitle"><div><div class="overline"><span class="rule"></span> POKER OBSERVATORY</div><h1>Sessions<span>.</span></h1></div><button id="import" class="secondary"><i data-icon="upload"></i>Import replay</button></section><div id="archiveList"></div></div>
<footer class="sitefoot"><span><img src="assets/mark.svg" alt="">River Room</span><small>AI poker observatory</small></footer>
</main>
<dialog id="dialog"><div class="modalhead"><h2 id="dialogtitle"></h2><button class="square" id="close" aria-label="Close dialog"><i data-icon="close"></i></button></div><div id="dialogbody"></div></dialog>
<input type="file" id="file" accept=".json,application/json" hidden><div id="notice" role="status"></div>
<script type="module" src="./app.js"></script></body></html>
